#cloud-config
# LLMBench worker provisioning
# Installs Ollama, pulls models, clones LLMBench, starts the worker agent.
# Total boot time: ~5-10 min depending on model size.

package_update: true
package_upgrade: false

packages:
  - curl
  - git
  - python3
  - python3-pip
  - python3-venv
  - jq

write_files:
  - path: /opt/llmbench/config.env
    permissions: '0644'
    content: |
      CONTROLLER_URL=${controller_url}
      WORKER_ID=${worker_id}

  - path: /etc/systemd/system/llmbench-worker.service
    permissions: '0644'
    content: |
      [Unit]
      Description=LLMBench Worker Agent
      After=network.target ollama.service
      Wants=ollama.service

      [Service]
      Type=simple
      User=ubuntu
      WorkingDirectory=/opt/llmbench/app
      EnvironmentFile=/opt/llmbench/config.env
      ExecStartPre=/bin/bash -c 'until [ -f /opt/llmbench/setup-complete ]; do sleep 5; done'
      ExecStart=/opt/llmbench/venv/bin/llmbench worker \
        --controller-url $CONTROLLER_URL \
        --worker-id $WORKER_ID
      Restart=on-failure
      RestartSec=15

      [Install]
      WantedBy=multi-user.target

runcmd:
  - mkdir -p /opt/llmbench
  - chown ubuntu:ubuntu /opt/llmbench

  # Install Ollama
  - curl -fsSL https://ollama.ai/install.sh | sh
  - systemctl enable ollama
  - systemctl start ollama

  # Wait for Ollama to be ready (up to 60s)
  - |
    for i in $(seq 1 30); do
      if curl -sf http://localhost:11434/api/tags > /dev/null; then break; fi
      echo "Waiting for Ollama ($i/30)..."
      sleep 2
    done

  # Pull models (written by Terraform as JSON array)
  - echo '${models_to_pull}' > /tmp/models.json
  - |
    for model in $(jq -r '.[]' /tmp/models.json); do
      echo "Pulling $model..."
      ollama pull "$model" 2>&1 | tee -a /opt/llmbench/setup.log || true
    done

  # Clone LLMBench and install
  - git clone ${repo_url} /opt/llmbench/app
  - python3 -m venv /opt/llmbench/venv
  - /opt/llmbench/venv/bin/pip install --quiet --upgrade pip
  - /opt/llmbench/venv/bin/pip install --quiet -e /opt/llmbench/app
  - chown -R ubuntu:ubuntu /opt/llmbench

  # Start worker agent (only if controller_url is set)
  - systemctl daemon-reload
  - |
    source /opt/llmbench/config.env
    if [ -n "$CONTROLLER_URL" ]; then
      systemctl enable llmbench-worker.service
      systemctl start llmbench-worker.service
    fi

  - touch /opt/llmbench/setup-complete
  - echo "=== LLMBench worker ready ===" >> /opt/llmbench/setup.log

final_message: "LLMBench worker provisioning complete after $UPTIME seconds"
